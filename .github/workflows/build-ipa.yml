name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest valid Xcode
        run: |
          echo "=== Listing /Applications/ ==="
          ls -la /Applications/ | grep -i xcode || true
          echo ""
          echo "=== Searching for valid Xcode ==="
          SELECTED=""
          for candidate in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr) /Applications/Xcode.app; do
            echo "Checking: $candidate"
            if [ -d "$candidate/Contents/Developer" ]; then
              echo "  -> Valid, selecting this one"
              sudo xcode-select -s "$candidate/Contents/Developer"
              SELECTED="$candidate"
              break
            else
              echo "  -> Invalid (no Contents/Developer)"
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "ERROR: No valid Xcode found on this runner!"
            exit 1
          fi
          echo ""
          echo "=== Selected Xcode info ==="
          xcodebuild -version
          echo ""
          echo "=== iOS SDK version ==="
          xcrun --sdk iphoneos --show-sdk-version

      - name: Free up disk space
        run: |
          # Determine the Xcode we just selected so we don't delete it
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          echo "Active Xcode: $ACTIVE_XCODE"
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              echo "Removing: $x"
              sudo rm -rf "$x"
            fi
          done
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          sudo xcrun simctl delete unavailable 2>/dev/null || true
          df -h /

      - name: Install ldid
        run: brew install ldid

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Gecko
        run: ./tools/development/update-gecko.sh

      - name: Apply patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko
        run: ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          xcodebuild -project Reynard.xcodeproj \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
