name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid and isolated LLVM Linker
        run: |
          brew install ldid llvm@18
          
          LLVM_PREFIX=$(brew --prefix llvm@18)
          
          # Create a dedicated directory JUST for the linker for iOS code
          mkdir -p $HOME/custom-linker
          
          # Apple's clang specifically looks for 'ld64.lld' on Darwin platforms
          ln -sf "$LLVM_PREFIX/bin/lld" "$HOME/custom-linker/lld"
          ln -sf "$LLVM_PREFIX/bin/lld" "$HOME/custom-linker/ld64.lld"
          
          # Inject ONLY our custom directory into PATH. 
          echo "$HOME/custom-linker" >> $GITHUB_PATH

      - name: Install full WASI SDK
        run: |
          # Download the verified WASI SDK v33 for Apple Silicon (macOS 15)
          curl -LO https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-arm64-macos.tar.gz
          
          # Extract it safely into a known directory name
          mkdir -p wasi-sdk
          tar -xf wasi-sdk-33.0-arm64-macos.tar.gz -C wasi-sdk --strip-components=1
          
          # Export the full SDK paths so Mozilla's configure gets the headers AND the builtins
          echo "WASI_SYSROOT=$PWD/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV
          echo "WASM_CC=$PWD/wasi-sdk/bin/clang" >> $GITHUB_ENV
          echo "WASM_CXX=$PWD/wasi-sdk/bin/clang++" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Free up disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$x"
            fi
          done
          df -h /

      - name: Run developer build steps
        run: |
          # Prevent max() iterable SDK detection errors in Mozilla's mach
          unset SDKROOT
          
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
          ./tools/development/build-idevice.sh
          ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          # 1. Dynamically locate the exact path of the Xcode project (handles subfolders and case-sensitivity)
          PROJECT_PATH=$(find . -type d -iname "reynard.xcodeproj" | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "Error: Could not find Reynard.xcodeproj anywhere in the repository."
            echo "Here are the Xcode projects that DO exist:"
            find . -type d -name "*.xcodeproj"
            exit 1
          fi
          
          echo "Found Xcode project at: $PROJECT_PATH"
          
          # 2. Print available schemes for debugging in case the scheme name is also different
          xcodebuild -project "$PROJECT_PATH" -list
          
          # 3. Build the project using the dynamic path
          xcodebuild -project "$PROJECT_PATH" \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          
          # 1. Create the entitlements file required for Gecko's JavaScript JIT compiler
          cat << 'EOF' > entitlements.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>dynamic-codesigning</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 2. Pseudo-sign the main browser executable WITH the JIT entitlements
          # (Note: ldid requires no space between -S and the filename)
          ldid -Sentitlements.xml Payload/Reynard.app/Reynard
          
          # 3. Sign all dynamic libraries bundled with the engine
          find Payload/Reynard.app -name "*.dylib" -exec ldid -S {} \;
          
          # 4. Package it up
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
