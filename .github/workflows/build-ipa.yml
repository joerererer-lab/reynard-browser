name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Just ldid, no LLVM overrides
      - name: Install ldid
        run: brew install ldid

      # Restored from your original script (Required by Mozilla mach)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Restored from your original script (Required to compile Gecko)
      - name: Set up Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Free up disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$x"
            fi
          done
          df -h /

      - name: Run developer build steps
        run: |
          # The fix to prevent max() iterable SDK detection errors in Mozilla's mach
          unset SDKROOT
          
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
          ./tools/development/build-idevice.sh
          ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          xcodebuild -project Reynard.xcodeproj \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          
          # Sign binary and all dynamic libraries for sideloading
          ldid -S Payload/Reynard.app/Reynard
          find Payload/Reynard.app -name "*.dylib" -exec ldid -S {} \;
          
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
