name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Free up disk space
        run: |
          XCODES=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V)
          LATEST=$(echo "$XCODES" | tail -1)
          echo "Keeping: $LATEST"
          for x in $XCODES; do
            if [ "$x" != "$LATEST" ]; then
              echo "Removing: $x"
              sudo rm -rf "$x"
            fi
          done
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          sudo xcrun simctl delete unavailable 2>/dev/null || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          ls /Applications/ | grep -i xcode
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install ldid
        run: brew install ldid

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Gecko
        run: ./tools/development/update-gecko.sh

      - name: Apply patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko
        run: ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          xcodebuild -project Reynard.xcodeproj \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
