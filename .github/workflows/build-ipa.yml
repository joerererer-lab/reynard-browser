name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid and LLVM 18
        run: |
          brew install ldid
          brew install llvm@18
          LLVM_PREFIX=$(brew --prefix llvm@18)
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          # Ensure ld64.lld exists (Mach-O linker name clang looks for on Darwin)
          if [ -f "$LLVM_PREFIX/bin/lld" ] && [ ! -e "$LLVM_PREFIX/bin/ld64.lld" ]; then
            ln -sf "$LLVM_PREFIX/bin/lld" "$LLVM_PREFIX/bin/ld64.lld"
          fi

      - name: Show available linker tools
        run: |
          LLVM_PREFIX=$(brew --prefix llvm@18)
          echo "=== Linker binaries in $LLVM_PREFIX/bin ==="
          ls -la "$LLVM_PREFIX/bin/" | grep -iE 'ld|link' || true
          echo "=== Versions ==="
          which lld && lld --version || true
          which ld.lld && ld.lld --version || true
          which ld64.lld && ld64.lld --version || true
          echo "=== Apple ld ==="
          xcrun -f ld
          xcrun ld -v 2>&1 | head -3 || true

      - name: Free up disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$x"
            fi
          done
          df -h /

      - name: Run developer build steps
        run: |
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
          ./tools/development/build-idevice.sh
          ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          xcodebuild -project Reynard.xcodeproj \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          ldid -S Payload/Reynard.app/Reynard
          find Payload/Reynard.app -name "*.dylib" -exec ldid -S {} \;
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
