name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid and isolated LLVM Linker
        run: |
          brew install ldid llvm@18
          LLVM_PREFIX=$(brew --prefix llvm@18)
          mkdir -p $HOME/custom-linker
          ln -sf "$LLVM_PREFIX/bin/lld" "$HOME/custom-linker/lld"
          ln -sf "$LLVM_PREFIX/bin/lld" "$HOME/custom-linker/ld64.lld"
          echo "$HOME/custom-linker" >> $GITHUB_PATH

      - name: Install WASI SDK
        run: |
          curl -LO https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-arm64-macos.tar.gz
          mkdir -p wasi-sdk
          tar -xf wasi-sdk-33.0-arm64-macos.tar.gz -C wasi-sdk --strip-components=1
          echo "WASI_SYSROOT=$PWD/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV
          echo "WASM_CC=$PWD/wasi-sdk/bin/clang" >> $GITHUB_ENV
          echo "WASM_CXX=$PWD/wasi-sdk/bin/clang++" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Set up temporary keychain (for ad-hoc codesigning)
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASS=tempbuild
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

      - name: Free up disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$x"
            fi
          done
          df -h /

      - name: Compute cache key inputs
        id: cache-key
        run: |
          HASH=$(find engine/firefox/.mozconfig patches tools/development \
                  .gitmodules -type f 2>/dev/null | sort | xargs cat 2>/dev/null | shasum -a 256 | cut -c1-16)
          echo "build-hash=$HASH" >> $GITHUB_OUTPUT
          echo "Cache key hash: $HASH"

      - name: Restore Gecko build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            engine/firefox/obj-aarch64-apple-ios
          key: gecko-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.build-hash }}
          restore-keys: |
            gecko-build-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            support/idevice/target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Run developer build steps
        run: |
          unset SDKROOT
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
          echo 'mk_add_options AUTOCLOBBER=1' >> engine/firefox/.mozconfig
          ./tools/development/build-idevice.sh
          ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          PROJECT_PATH=$(find . -type d -iname "reynard.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "Error: Could not find Reynard.xcodeproj"
            find . -type d -name "*.xcodeproj"
            exit 1
          fi
          echo "Found Xcode project at: $PROJECT_PATH"
          xcodebuild -project "$PROJECT_PATH" -list
          
          # Added SWIFT_OPTIMIZATION_LEVEL="-Onone" to bypass the Swift compiler crash
          xcodebuild -project "$PROJECT_PATH" \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone"

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          cat << 'EOF' > entitlements.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>dynamic-codesigning</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          ldid -Sentitlements.xml Payload/Reynard.app/Reynard
          find Payload/Reynard.app -name "*.dylib" -exec ldid -S {} \;
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
