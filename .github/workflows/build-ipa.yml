name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid and LLVM 18
        run: |
          brew install ldid
          brew install llvm@18
          LLVM_PREFIX=$(brew --prefix llvm@18)
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          if [ -f "$LLVM_PREFIX/bin/lld" ] && [ ! -e "$LLVM_PREFIX/bin/ld64.lld" ]; then
            ln -sf "$LLVM_PREFIX/bin/lld" "$LLVM_PREFIX/bin/ld64.lld"
          fi

      - name: Remove CommandLineTools SDKs (force Xcode SDKs only)
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools/SDKs
          echo "Removed. Verifying only Xcode SDKs remain:"
          ls /Library/Developer/CommandLineTools/ 2>/dev/null || echo "CommandLineTools dir gone (fine)"
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk macosx --show-sdk-path

      - name: Free up disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$x"
            fi
          done
          df -h /

      - name: Run developer build steps
        run: |
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
          ./tools/development/build-idevice.sh
          ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          xcodebuild -project Reynard.xcodeproj \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          ldid -S Payload/Reynard.app/Reynard
          find Payload/Reynard.app -name "*.dylib" -exec ldid -S {} \;
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
