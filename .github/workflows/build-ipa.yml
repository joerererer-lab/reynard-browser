name: Build Reynard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid and isolated LLVM Linker
        run: |
          brew install ldid llvm@18
          
          LLVM_PREFIX=$(brew --prefix llvm@18)
          
          # Create a dedicated directory JUST for the linker
          mkdir -p $HOME/custom-linker
          
          # Apple's clang specifically looks for 'ld64.lld' on Darwin platforms
          # We symlink it here so clang can find it
          ln -sf "$LLVM_PREFIX/bin/lld" "$HOME/custom-linker/lld"
          ln -sf "$LLVM_PREFIX/bin/lld" "$HOME/custom-linker/ld64.lld"
          
          # Inject ONLY our custom directory into PATH. 
          # This forces Mozilla to use lld, while preserving Apple's /usr/bin/clang!
          echo "$HOME/custom-linker" >> $GITHUB_PATH
          
          # Globally export the WASM compilers to the runner environment
          # so Mozilla's configure scripts absolutely cannot ignore them
          echo "WASM_CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
          echo "WASM_CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Free up disk space
        run: |
          ACTIVE_XCODE=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null); do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$x"
            fi
          done
          df -h /

      - name: Run developer build steps
        run: |
          # Prevent max() iterable SDK detection errors in Mozilla's mach
          unset SDKROOT
          
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
          
          # We have the WASM compiler, but not the WASI sysroot headers.
          # This flag tells Mozilla to skip building the WASM sandbox entirely.
          echo "ac_add_options --without-wasm-sandboxed-libraries" >> engine/firefox/.mozconfig
          
          ./tools/development/build-idevice.sh
          ./tools/development/build-gecko.sh

      - name: Build Reynard.app
        run: |
          xcodebuild -project Reynard.xcodeproj \
            -scheme Reynard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Reynard.app Payload/
          
          # Sign binary and all dynamic libraries for sideloading
          ldid -S Payload/Reynard.app/Reynard
          find Payload/Reynard.app -name "*.dylib" -exec ldid -S {} \;
          
          zip -r Reynard.ipa Payload
          ls -lh Reynard.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPA
          path: Reynard.ipa
          retention-days: 30
